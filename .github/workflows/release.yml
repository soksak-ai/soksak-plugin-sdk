name: release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          package_json_file: package.json
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Verify and package with the owner commands
        run: make verify package REGISTRY=https://registry.npmjs.org/
      - name: Mint a least-privilege installation token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.SOKSAK_RELEASE_CLIENT_ID }}
          private-key: ${{ secrets.SOKSAK_RELEASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: soksak-sdk
          permission-administration: read
          permission-contents: write
      - name: Publish the verified owner manifest and assets
        env:
          SOKSAK_RELEASE_TOKEN: ${{ steps.release-token.outputs.token }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          node .dependencies/soksak-spec/release-template/publish-canonical-release.mjs \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$GITHUB_SHA" \
            --artifacts "$GITHUB_WORKSPACE/artifacts/$version" \
            --manifest "$GITHUB_WORKSPACE/artifacts/$version/release.json"
